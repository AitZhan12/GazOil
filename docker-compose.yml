services:
  backend:
    build:
      context: ./azs-backend
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/azs
      SPRING_DATASOURCE_USERNAME: azs
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-azs}
      SERVER_PORT: 8080
      API_CLOUD: ${API_CLOUD:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./front
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
