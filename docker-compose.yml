services:
  db:
    image: postgres:16-alpine
    profiles:
      - docker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: azs
      POSTGRES_USER: azs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azs -d azs"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gazoil-network

  backend:
    build:
      context: ./azs-backend
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/azs}
      SPRING_DATASOURCE_USERNAME: azs
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080

  frontend:
    build:
      context: ./front
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gazoil-network

networks:
  gazoil-network:
    driver: bridge

volumes:
  postgres-data:
